[build]
  # bun.lock exists locally (this repo was developed with bun), but the
  # build itself is plain `vite build` with no bun-specific APIs — using
  # npm here avoids depending on Netlify's bun support being available/
  # current, at the cost of npm resolving fresh from package.json's
  # ^-ranges instead of the local lockfile (fine for a portfolio; nothing
  # here is version-sensitive).
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# single-page app: every path lands on client-side content (anchor-scroll
# navigation, no router), so any deep link or refresh should still get
# index.html rather than Netlify's default 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
